# UPS-Uninterruptible-Power-Supply-
<!DOCTYPE html>
<html>
<head>
    <title>UPS Simulation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }

        #status {
            font-size: 22px;
            color: green;
        }

        #battery {
            font-size: 20px;
            color: blue;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>UPS (Uninterruptible Power Supply)</h2>

    <p id="status">Mains Power Available</p>
    <p id="battery">Battery: 100%</p>

    <button onclick="mainsOn()">Mains ON</button>
    <button onclick="mainsOff()">Mains OFF</button>

</div>

<script>

let battery = 100;
let mains = true;

function mainsOn() {
    mains = true;

    document.getElementById("status").innerHTML =
        "Mains Power Available";

    document.getElementById("status").style.color = "green";
}

function mainsOff() {
    mains = false;

    document.getElementById("status").innerHTML =
        "Mains OFF - Battery Backup ON";

    document.getElementById("status").style.color = "red";
}

// Battery simulation
setInterval(function() {

    if (!mains && battery > 0) {
        battery -= 1;
    }

    if (mains && battery < 100) {
        battery += 1;
    }

    document.getElementById("battery").innerHTML =
        "Battery: " + battery + "%";

}, 1000);

</script>

</body>
</html>
